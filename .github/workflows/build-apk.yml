name: Build LiquidGlassSiri APK

on:
workflow_dispatch:
push:
branches:
- main
- master

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Locate Android project
    shell: bash
    run: |
      set -e
      echo "Repository contents:"
      ls -la

      if [ -f "LiquidGlassSiri-Project.zip" ]; then
        unzip -o LiquidGlassSiri-Project.zip -d extracted
      fi

      if [ -f "gradlew" ]; then
        PROJECT_DIR="."
      elif [ -f "extracted/gradlew" ]; then
        PROJECT_DIR="extracted"
      elif [ -f "LiquidGlassSiri/gradlew" ]; then
        PROJECT_DIR="LiquidGlassSiri"
      else
        GRADLEW_PATH=$(find . -type f -name gradlew -print -quit)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "ERROR: Could not find gradlew."
          echo "Make sure your Android project files or ZIP are uploaded."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Android project found at: $PROJECT_DIR"

  - name: Make Gradle wrapper executable
    run: chmod +x "$PROJECT_DIR/gradlew"

  - name: Build debug APK
    run: |
      cd "$PROJECT_DIR"
      ./gradlew --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: LiquidGlassSiri-debug-APK
      path: |
        ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
