name: Build LiquidGlassSiri APK

on:
workflow_dispatch:
push:
branches:
- main
- master

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Locate Android project
    shell: bash
    run: |
      set -e
      echo "Repository contents:"
      ls -la

      if [ -f "LiquidGlassSiri-Project.zip" ]; then
        unzip -o "LiquidGlassSiri-Project.zip" -d extracted
      fi

      if [ -f "gradlew" ]; then
        echo "PROJECT_DIR=." >> "$GITHUB_ENV"
      elif [ -f "extracted/gradlew" ]; then
        echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
      else
        WRAPPER=$(find . -type f -name gradlew -print -quit)
        if [ -z "$WRAPPER" ]; then
          echo "ERROR: Could not find gradlew or an Android Gradle project."
          exit 1
        fi
        echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"
      fi

  - name: Make Gradle wrapper executable
    run: chmod +x "$PROJECT_DIR/gradlew"

  - name: Build debug APK
    working-directory: .
    run: |
      cd "$PROJECT_DIR"
      ./gradlew --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: LiquidGlassSiri-debug-APK
      path: |
        **/build/outputs/apk/debug/*.apk
      if-no-files-found: error
